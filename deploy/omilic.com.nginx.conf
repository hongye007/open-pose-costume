server {
    listen 80;
    listen [::]:80;
    server_name omilic.com www.omilic.com;
    return 301 https://omilic.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name omilic.com www.omilic.com;

    ssl_certificate /etc/letsencrypt/live/omilic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omilic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/omilic.com/current;
    index index.html;
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }

    location ~* ^/(assets|custom|images|brand)/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location = /data/catalog.json {
        try_files $uri =404;
        expires 10m;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
